<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COTTON – Pure Comfort. Timeless Style.</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Poppins, sans-serif;
background:#fff;
color:#111;
overflow-x:hidden;
}

/* NAVBAR */
nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 60px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(8px);
transition:.4s;
z-index:1000;
}
nav.scrolled{
background:#fff;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
}
.logo{
font-family:'Playfair Display',serif;
font-size:28px;
letter-spacing:2px;
}
nav ul{
display:flex;
gap:30px;
list-style:none;
}
nav ul li{
cursor:pointer;
font-weight:500;
transition:.3s;
}
nav ul li:hover{
color:#777;
}

/* HERO */
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:url("https://images.unsplash.com/photo-1520975922203-b8c90b1c6f2c") center/cover no-repeat;
position:relative;
}
.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.35);
}
.hero-content{
position:relative;
color:#fff;
animation:fadeUp 1.5s ease;
}
.hero h1{
font-size:80px;
letter-spacing:5px;
font-family:'Playfair Display',serif;
}
.hero p{
margin-top:15px;
font-size:20px;
opacity:0.9;
}
.btn{
margin-top:30px;
padding:14px 40px;
border:none;
background:#fff;
color:#111;
font-weight:600;
cursor:pointer;
border-radius:30px;
transition:.4s;
}
.btn:hover{
box-shadow:0 0 20px rgba(255,255,255,0.8);
transform:translateY(-3px);
}

/* FEATURED */
.section{
padding:90px 60px;
text-align:center;
}
.section h2{
font-size:36px;
margin-bottom:40px;
font-family:'Playfair Display',serif;
}
.products{
display:flex;
gap:25px;
overflow-x:auto;
scroll-behavior:smooth;
}
.card{
min-width:250px;
background:#fafafa;
border-radius:12px;
overflow:hidden;
transition:.4s;
box-shadow:0 6px 20px rgba(0,0,0,0.08);
}
.card img{
width:100%;
height:320px;
object-fit:cover;
transition:.5s;
}
.card:hover img{
transform:scale(1.1);
}
.card h3{
padding:15px;
}

/* BANNER */
.banner{
height:350px;
display:flex;
align-items:center;
justify-content:center;
background:url("https://images.unsplash.com/photo-1503342217505-b0a15ec3261c") center/cover fixed;
color:#fff;
text-align:center;
}
.banner h2{
font-size:42px;
background:rgba(0,0,0,0.4);
padding:20px 40px;
border-radius:10px;
}

/* FOOTER */
footer{
background:#111;
color:#eee;
text-align:center;
padding:40px;
margin-top:60px;
}

/* ANIMATIONS */
@keyframes fadeUp{
from{opacity:0; transform:translateY(40px)}
to{opacity:1; transform:translateY(0)}
}

/* MOBILE */
@media(max-width:768px){
.hero h1{font-size:48px}
nav{padding:15px 20px}
.section{padding:70px 20px}
}
</style>
</head>

<body>

<nav id="navbar">
<div class="logo">COTTON</div>
<ul>
<li>Home</li>
<li>Men</li>
<li>Women</li>
<li>New Arrivals</li>
<li>Contact</li>
</ul>
</nav>

<section class="hero">
<div class="hero-content">
<h1>COTTON</h1>
<p>Pure Comfort. Timeless Style.</p>
<button class="btn">Explore Collection</button>
</div>
</section>

<section class="section">
<h2>Featured Cotton Wear</h2>
<div class="products">
<div class="card">
<img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b">
<h3>Cotton T-Shirt</h3>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f">
<h3>Cotton Hoodie</h3>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d">
<h3>Cotton Shirt</h3>
</div>
<div class="card">
<img src="https://images.unsplash.com/photo-1483985988355-763728e1935b">
<h3>Summer Cotton</h3>
</div>
</div>
</section>

<section class="banner">
<h2>New Summer Cotton Collection</h2>
</section>

<footer>
<p>© 2026 COTTON — All Rights Reserved</p>
</footer>

<script>
window.addEventListener("scroll",function(){
let nav=document.getElementById("navbar");
if(window.scrollY>50){
nav.classList.add("scrolled");
}else{
nav.classList.remove("scrolled");
}
});
</script>

</body>
</html>
